<!doctype html>
<html lang="en" data-theme="">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<!-- GA4 enhanced measurement owns page views, including client-side navigation. -->
		<script id="analytics-bootstrap">
			(() => {
				if (!['cphiri.dev', 'www.cphiri.dev'].includes(window.location.hostname)) return;

				window.dataLayer = window.dataLayer || [];
				window.gtag = function () {
					window.dataLayer.push(arguments);
				};
				window.gtag('js', new Date());
				window.gtag('config', 'G-79022KEJ81');

				const script = document.createElement('script');
				script.async = true;
				script.src = 'https://www.googletagmanager.com/gtag/js?id=G-79022KEJ81';
				document.head.appendChild(script);
			})();
		</script>
	</head>

	<body data-sveltekit-preload-data="hover" class="overflow-x-hidden">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
